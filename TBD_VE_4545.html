  .resumen{display:flex;gap:8px;padding:4px 10px 10px;}

                margin:14px 0 6px;border-bottom:1px solid var(--borde);padding-bottom:4px;}

  .cliente-cab{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;cursor:pointer;background:#fff;}
  .cliente.tiene .cliente-cab{border-left:4px solid var(--verde);}
  .cliente.cero .cliente-cab{border-left:4px solid var(--rojo);}
  .cliente-nombre{font-size:13.5px;font-weight:600;}
  .cliente-cod{font-size:11px;color:var(--gris);font-weight:400;}

  .badge-rojo{background:var(--rojo-bg);color:var(--rojo);}

  .cliente-detalle{display:none;padding:8px 10px 10px;border-top:1px solid var(--borde);background:#fafafa;}
  .cliente.abierto .cliente-detalle{display:block;}

  .combo-lista{display:flex;flex-wrap:wrap;gap:6px;}
  .combo-tag{font-size:11px;padding:4px 8px;border-radius:8px;}
  .combo-tag.si{background:var(--verde-bg);color:var(--verde);}
  .combo-tag.no{background:var(--rojo-bg);color:var(--rojo);}

  .top5-item{font-size:12.5px;padding:5px 8px;background:var(--rojo-bg);color:var(--rojo);border-radius:8px;margin-bottom:4px;}

  .bloque-cero{margin-top:6px;}
  .bloque-cero summary{font-size:12.5px;color:var(--gris);cursor:pointer;padding:6px 2px;}

  .vacio{padding:20px;text-align:center;color:var(--gris);font-size:13px;}

const DIAS = ["LU","MA","MI","JU","VI","SA"];
const DIA_LABEL = {LU:"Lunes", MA:"Martes", MI:"Miércoles", JU:"Jueves", VI:"Viernes", SA:"Sábado"};

let kpiActual = DATOS.kpis[0];
let diaFiltro = null;
let busqueda = "";

function clientesDelDia(dia){
  return DATOS.clientes.filter(c => c.dias.includes(dia));
}

function pasaBusqueda(c){
  if(!busqueda) return true;
  const q = busqueda.toLowerCase();
  return c.nombre.toLowerCase().includes(q) || String(c.cod).includes(q);
}

function renderSemana(){
  const cont = document.getElementById("semana");
  cont.innerHTML = "";
  DIAS.forEach(dia => {
    const clientes = clientesDelDia(dia);
    const enCero = clientes.filter(c => c.kpi[kpiActual].tiene === 0).length;
    const btn = document.createElement("div");
    btn.className = "dia-btn" + (dia === diaFiltro ? " activo" : "") + (enCero === 0 && clientes.length>0 ? " cero0" : "");
    btn.innerHTML = `${dia}<span class="n">${enCero}</span>`;
    btn.onclick = () => { diaFiltro = (diaFiltro === dia) ? null : dia; renderTodo(); };
    cont.appendChild(btn);
  });
}

function renderKpis(){
  const cont = document.getElementById("kpis");
  cont.innerHTML = "";
  DATOS.kpis.forEach(k => {
    const t = DATOS.kpiTotales[k];
    const chip = document.createElement("div");
    chip.className = "kpi-chip" + (k === kpiActual ? " activo" : "");
    chip.innerHTML = `${k}<span class="conteo">${t.tbd}</span>`;
    chip.title = `${t.tbd} combinaciones marca+calibre distintas este mes, entre ${t.clientes_con_tbd} de tus ${t.total_clientes} clientes`;
    chip.onclick = () => { kpiActual = k; renderTodo(); };
    cont.appendChild(chip);
  });
}

function clientesFiltradosBase(){
  let base = DATOS.clientes;
  if(diaFiltro) base = base.filter(c => c.dias.includes(diaFiltro));
  return base.filter(pasaBusqueda);
}

function renderResumen(){
  const lista = clientesFiltradosBase();
  const conTbd = lista.filter(c => c.kpi[kpiActual].tiene > 0).length;
  const enCero = lista.length - conTbd;
  document.getElementById("resumen").innerHTML = `
    <div class="card"><b>${lista.length}</b><span>Clientes</span></div>
    <div class="card"><b style="color:var(--verde)">${conTbd}</b><span>Con TBD</span></div>
    <div class="card"><b style="color:var(--rojo)">${enCero}</b><span>En cero</span></div>
  `;
}

function detalleHtml(c){
  const info = c.kpi[kpiActual];
  if(info.modo === "lista"){
    return `<div class="combo-lista">` + info.combos.map(([nom, tiene]) =>
      `<span class="combo-tag ${tiene ? "si":"no"}">${nom}</span>`
    ).join("") + `</div>`;
  } else {
    if(info.faltan.length === 0){
      return `<div class="top5-titulo">Tiene todos los combos relevantes de su sub-canal 👏</div>`;
    }
    return `<div class="top5-titulo">Le podés ofrecer (lo más vendido en su rubro que no tiene):</div>` +
      info.faltan.map(f => `<div class="top5-item">${f}</div>`).join("");
  }
}

function clienteHtml(c){
  const info = c.kpi[kpiActual];
  const tieneAlgo = info.tiene > 0;
  return `
    <div class="cliente ${tieneAlgo ? "tiene":"cero"}" data-cod="${c.cod}">
      <div class="cliente-cab" onclick="toggleCliente(${c.cod})">
        <div>
          <div class="cliente-nombre">${c.nombre}</div>
          <div class="cliente-cod">Cód. ${c.cod}</div>
        </div>
        <div class="cliente-badge ${tieneAlgo?"badge-verde":"badge-rojo"}">${info.tiene}/${info.total}</div>
      </div>
      <div class="cliente-detalle">${detalleHtml(c)}</div>
    </div>
  `;
}

function toggleCliente(cod){
  const el = document.querySelector(`.cliente[data-cod="${cod}"]`);
  if(el) el.classList.toggle("abierto");
}

function renderListado(){
  const cont = document.getElementById("listado");
  const diasAMostrar = diaFiltro ? [diaFiltro] : DIAS;
  let html = "";
  let huboAlgo = false;

  diasAMostrar.forEach(dia => {
    const clientes = clientesDelDia(dia).filter(pasaBusqueda);
    if(clientes.length === 0) return;
    huboAlgo = true;
    const conTbd = clientes.filter(c => c.kpi[kpiActual].tiene > 0)
      .sort((a,b)=> a.nombre.localeCompare(b.nombre) || a.cod - b.cod);
    const enCero = clientes.filter(c => c.kpi[kpiActual].tiene === 0)
      .sort((a,b)=> a.nombre.localeCompare(b.nombre) || a.cod - b.cod);

    html += `<div class="dia-grupo"><h2>${DIA_LABEL[dia]} · ${clientes.length} clientes</h2>`;
    html += conTbd.map(clienteHtml).join("");
    if(enCero.length){
      html += `<details class="bloque-cero"><summary>En cero (${enCero.length}) — tocar para ver</summary>`;
      html += enCero.map(clienteHtml).join("");
      html += `</details>`;
    }
    html += `</div>`;
  });

  cont.innerHTML = huboAlgo ? html : `<div class="vacio">No hay clientes para este filtro.</div>`;
}

function textoResumen(){
  const lista = clientesFiltradosBase();
  const enCero = lista.filter(c => c.kpi[kpiActual].tiene === 0)
    .sort((a,b)=> a.nombre.localeCompare(b.nombre));
  const conTbd = lista.filter(c => c.kpi[kpiActual].tiene > 0).length;
  let dia = diaFiltro ? DIA_LABEL[diaFiltro] : "Toda la semana";
  let txt = `${kpiActual} — VE ${DATOS.ve} — ${dia}\n`;
  txt += `Clientes: ${lista.length} | Con TBD: ${conTbd} | En cero: ${enCero.length}\n\n`;
  if(enCero.length){
    txt += `En cero:\n`;
    enCero.forEach(c => { txt += `- ${c.nombre} (${c.cod})\n`; });
  }
  return txt;
}

document.getElementById("btnCopiar").onclick = async () => {
  const txt = textoResumen();
  try{
    await navigator.clipboard.writeText(txt);
    alert("Resumen copiado.");
  }catch(e){
    prompt("Copiá el texto:", txt);
  }
};

document.getElementById("btnWsp").onclick = () => {
  const txt = textoResumen();
  const url = "https://wa.me/?text=" + encodeURIComponent(txt);
  window.open(url, "_blank");
};

document.getElementById("buscador").addEventListener("input", (e) => {
  busqueda = e.target.value;
  renderResumen();
  renderListado();
});

function renderTodo(){
  renderSemana();
  renderKpis();
  renderResumen();
  renderListado();
}

renderTodo();
</script>
</body>
