const DIAS = ["LU","MA","MI","JU","VI","SA"];
const DIA_LABEL = {LU:"Lunes", MA:"Martes", MI:"Miércoles", JU:"Jueves", VI:"Viernes", SA:"Sábado"};

let kpiActual = DATOS.kpis[0];
let diaFiltro = null;
let busqueda = "";

// --- navegación de vistas (dashboard / lista de clientes / detalle de negociación) ---
let vista = "dashboard";
let listaActual = [];
let listaTitulo = "";
let listaCampoRecencia = null;
let clienteDetalleCod = null;

const GRUPOS_CCC = {
  CCC_CVZ: {titulo: "CCC CVZ · con compra de cerveza", filtro: c => c.kpi["TBD CZA"].tiene > 0, campoRecencia: null},
  CNC_CVZ: {titulo: "CNC CVZ · sin compra de cerveza", filtro: c => c.kpi["TBD CZA"].tiene === 0, campoRecencia: "cerveza"},
  CCC_UNG: {titulo: "CCC UNG · con compra de UNG/gaseosa", filtro: c => c.kpi["TBD UNG + AGUA"].tiene > 0, campoRecencia: null},
  CNC_UNG: {titulo: "CNC UNG · sin compra de UNG/gaseosa", filtro: c => c.kpi["TBD UNG + AGUA"].tiene === 0, campoRecencia: "ung"},
};

function irALista(tipo){
  const spec = GRUPOS_CCC[tipo];
  listaActual = DATOS.clientes.filter(spec.filtro).slice().sort((a, b) =>
    (b.negociacion.tiene - a.negociacion.tiene) || a.nombre.localeCompare(b.nombre)
  );
  listaTitulo = spec.titulo;
  listaCampoRecencia = spec.campoRecencia;
  vista = "lista";
  renderTodo();
  window.scrollTo(0, 0);
}

function irADetalle(cod){
  const c = DATOS.clientes.find(x => x.cod === cod);
  if(!c || !c.negociacion.tiene) return;
  clienteDetalleCod = cod;
  vista = "detalle";
  renderTodo();
  window.scrollTo(0, 0);
}

function volver(){
  vista = (vista === "detalle") ? "lista" : "dashboard";
  renderTodo();
  window.scrollTo(0, 0);
}

function clientesDelDia(dia){
  return DATOS.clientes.filter(c => c.dias.includes(dia));
}

function pasaBusqueda(c){
  if(!busqueda) return true;
  const q = busqueda.toLowerCase();
  return c.nombre.toLowerCase().includes(q) || String(c.cod).includes(q);
}

function renderSemana(){
  const cont = document.getElementById("semana");
  cont.innerHTML = "";
  DIAS.forEach(dia => {
    const clientes = clientesDelDia(dia);
    const enCero = clientes.filter(c => c.kpi[kpiActual].tiene === 0).length;
    const btn = document.createElement("div");
    btn.className = "dia-btn" + (dia === diaFiltro ? " activo" : "") + (enCero === 0 && clientes.length>0 ? " cero0" : "");
    btn.innerHTML = `${dia}<span class="n">${enCero}</span>`;
    btn.onclick = () => { diaFiltro = (diaFiltro === dia) ? null : dia; renderTodo(); };
    cont.appendChild(btn);
  });
}

function renderCccBotones(){
  const cvzSi = DATOS.clientes.filter(GRUPOS_CCC.CCC_CVZ.filtro).length;
  const cvzNo = DATOS.clientes.length - cvzSi;
  const ungSi = DATOS.clientes.filter(GRUPOS_CCC.CCC_UNG.filtro).length;
  const ungNo = DATOS.clientes.length - ungSi;
  document.getElementById("ccc-botones").innerHTML = `
    <div class="ccc-titulo">Cerveza</div>
    <div class="ccc-par">
      <div class="ccc-btn si" onclick="irALista('CCC_CVZ')"><span class="n">${cvzSi}</span><span class="lbl">CCC CVZ</span></div>
      <div class="ccc-btn no" onclick="irALista('CNC_CVZ')"><span class="n">${cvzNo}</span><span class="lbl">CNC CVZ</span></div>
    </div>
    <div class="ccc-titulo">UNG / gaseosas</div>
    <div class="ccc-par">
      <div class="ccc-btn si" onclick="irALista('CCC_UNG')"><span class="n">${ungSi}</span><span class="lbl">CCC UNG</span></div>
      <div class="ccc-btn no" onclick="irALista('CNC_UNG')"><span class="n">${ungNo}</span><span class="lbl">CNC UNG</span></div>
    </div>
  `;
}

function renderLista(){
  document.getElementById("lista-titulo").textContent = listaTitulo;
  const cont = document.getElementById("lista-clientes");
  if(!listaActual.length){
    cont.innerHTML = `<div class="vacio">No hay clientes en este grupo.</div>`;
    return;
  }
  cont.innerHTML = listaActual.map(c => {
    const neg = c.negociacion.tiene;
    const recenciaLinea = listaCampoRecencia
      ? `<div class="fc-sub">Última compra: ${c.recencia[listaCampoRecencia] || "sin datos"}</div>`
      : "";
    return `
      <div class="fila-cliente ${neg ? "tiene-neg" : ""}" ${neg ? `onclick="irADetalle(${c.cod})"` : ""}>
        <div>
          <div class="fc-nombre">${c.nombre}</div>
          <div class="fc-sub">Cód. ${c.cod} · ${c.canal || "Sin canal"}</div>
          ${recenciaLinea}
        </div>
        <div class="fc-badge ${neg ? "si" : ""}">${neg ? "Negociación" : "Sin negoc."}</div>
      </div>
    `;
  }).join("");
}

function formatoItemNegociacion(item){
  if(item.tipo === "Sin cargo fijo"){
    return `${item.tipo}: ${item.por_mes}/mes <span class="detalle-item-sub">(restan ${item.restante} de ${item.total} en la vigencia)</span>`;
  }
  return `${item.tipo}: ${item.valor_pct}%`;
}

function renderDetalle(){
  const c = DATOS.clientes.find(x => x.cod === clienteDetalleCod);
  const cont = document.getElementById("detalle-contenido");
  if(!c){ cont.innerHTML = ""; return; }

  const items = c.negociacion.items || [];
  const porUnidad = {};
  items.forEach(item => {
    (porUnidad[item.unidad] = porUnidad[item.unidad] || []).push(item);
  });

  const bloques = Object.keys(porUnidad).sort().map(unidad => `
    <div class="detalle-unidad">
      <div class="detalle-unidad-titulo">${unidad}</div>
      ${porUnidad[unidad].map(item => `
        <div class="detalle-linea">
          <div class="detalle-linea-nombre">${item.linea}</div>
          <div class="detalle-item">${formatoItemNegociacion(item)}</div>
        </div>
      `).join("")}
    </div>
  `).join("");

  cont.innerHTML = `
    <div class="fc-nombre" style="font-size:16px">${c.nombre}</div>
    <div class="fc-sub">Cód. ${c.cod} · ${c.canal || "Sin canal"}</div>
    ${bloques || '<div class="vacio">Sin negociaciones vigentes.</div>'}
  `;
}

function renderKpis(){
  const cont = document.getElementById("kpis");
  cont.innerHTML = "";
  DATOS.kpis.forEach(k => {
    const t = DATOS.kpiTotales[k];
    const chip = document.createElement("div");
    chip.className = "kpi-chip" + (k === kpiActual ? " activo" : "");
    chip.innerHTML = `${k}<span class="conteo">${t.tbd}</span>`;
    chip.title = `${t.tbd} combinaciones marca+calibre distintas este mes, entre ${t.clientes_con_tbd} de tus ${t.total_clientes} clientes`;
    chip.onclick = () => { kpiActual = k; renderTodo(); };
    cont.appendChild(chip);
  });
}

function clientesFiltradosBase(){
  let base = DATOS.clientes;
  if(diaFiltro) base = base.filter(c => c.dias.includes(diaFiltro));
  return base.filter(pasaBusqueda);
}

function renderResumen(){
  const lista = clientesFiltradosBase();
  const conTbd = lista.filter(c => c.kpi[kpiActual].tiene > 0).length;
  const enCero = lista.length - conTbd;
  document.getElementById("resumen").innerHTML = `
    <div class="card"><b>${lista.length}</b><span>Clientes</span></div>
    <div class="card"><b style="color:var(--verde)">${conTbd}</b><span>Con TBD</span></div>
    <div class="card"><b style="color:var(--rojo)">${enCero}</b><span>En cero</span></div>
  `;
}

function detalleHtml(c){
  const info = c.kpi[kpiActual];
  if(info.modo === "lista"){
    return `<div class="combo-lista">` + info.combos.map(([nom, tiene]) =>
      `<span class="combo-tag ${tiene ? "si":"no"}">${nom}</span>`
    ).join("") + `</div>`;
  } else {
    if(info.faltan.length === 0){
      return `<div class="top5-titulo">Tiene todos los combos relevantes de su sub-canal 👏</div>`;
    }
    return `<div class="top5-titulo">Le podés ofrecer (lo más vendido en su rubro que no tiene):</div>` +
      info.faltan.map(f => `<div class="top5-item">${f}</div>`).join("");
  }
}

function clienteHtml(c){
  const info = c.kpi[kpiActual];
  const tieneAlgo = info.tiene > 0;
  return `
    <div class="cliente ${tieneAlgo ? "tiene":"cero"}" data-cod="${c.cod}">
      <div class="cliente-cab" onclick="toggleCliente(${c.cod})">
        <div>
          <div class="cliente-nombre">${c.nombre}</div>
          <div class="cliente-cod">Cód. ${c.cod}</div>
        </div>
        <div class="cliente-badge ${tieneAlgo?"badge-verde":"badge-rojo"}">${info.tiene}/${info.total}</div>
      </div>
      <div class="cliente-detalle">${detalleHtml(c)}</div>
    </div>
  `;
}

function toggleCliente(cod){
  const el = document.querySelector(`.cliente[data-cod="${cod}"]`);
  if(el) el.classList.toggle("abierto");
}

function renderListado(){
  const cont = document.getElementById("listado");
  const diasAMostrar = diaFiltro ? [diaFiltro] : DIAS;
  let html = "";
  let huboAlgo = false;

  diasAMostrar.forEach(dia => {
    const clientes = clientesDelDia(dia).filter(pasaBusqueda);
    if(clientes.length === 0) return;
    huboAlgo = true;
    const conTbd = clientes.filter(c => c.kpi[kpiActual].tiene > 0)
      .sort((a,b)=> a.nombre.localeCompare(b.nombre) || a.cod - b.cod);
    const enCero = clientes.filter(c => c.kpi[kpiActual].tiene === 0)
      .sort((a,b)=> a.nombre.localeCompare(b.nombre) || a.cod - b.cod);

    html += `<div class="dia-grupo"><h2>${DIA_LABEL[dia]} · ${clientes.length} clientes</h2>`;
    html += conTbd.map(clienteHtml).join("");
    if(enCero.length){
      html += `<details class="bloque-cero"><summary>En cero (${enCero.length}) — tocar para ver</summary>`;
      html += enCero.map(clienteHtml).join("");
      html += `</details>`;
    }
    html += `</div>`;
  });

  cont.innerHTML = huboAlgo ? html : `<div class="vacio">No hay clientes para este filtro.</div>`;
}

function textoResumen(){
  const lista = clientesFiltradosBase();
  const enCero = lista.filter(c => c.kpi[kpiActual].tiene === 0)
    .sort((a,b)=> a.nombre.localeCompare(b.nombre));
  const conTbd = lista.filter(c => c.kpi[kpiActual].tiene > 0).length;
  let dia = diaFiltro ? DIA_LABEL[diaFiltro] : "Toda la semana";
  let txt = `${kpiActual} — VE ${DATOS.ve} — ${dia}\n`;
  txt += `Clientes: ${lista.length} | Con TBD: ${conTbd} | En cero: ${enCero.length}\n\n`;
  if(enCero.length){
    txt += `En cero:\n`;
    enCero.forEach(c => { txt += `- ${c.nombre} (${c.cod})\n`; });
  }
  return txt;
}

document.getElementById("btnCopiar").onclick = async () => {
  const txt = textoResumen();
  try{
    await navigator.clipboard.writeText(txt);
    alert("Resumen copiado.");
  }catch(e){
    prompt("Copiá el texto:", txt);
  }
};

document.getElementById("btnWsp").onclick = () => {
  const txt = textoResumen();
  const url = "https://wa.me/?text=" + encodeURIComponent(txt);
  window.open(url, "_blank");
};

document.getElementById("buscador").addEventListener("input", (e) => {
  busqueda = e.target.value;
  renderResumen();
  renderListado();
});

function renderTodo(){
  document.getElementById("vista-dashboard").style.display = (vista === "dashboard") ? "" : "none";
  document.getElementById("vista-lista").style.display = (vista === "lista") ? "" : "none";
  document.getElementById("vista-detalle").style.display = (vista === "detalle") ? "" : "none";

  if(vista === "dashboard"){
    renderCccBotones();
    renderSemana();
    renderKpis();
    renderResumen();
    renderListado();
  } else if(vista === "lista"){
    renderLista();
  } else if(vista === "detalle"){
    renderDetalle();
  }
}

renderTodo();
</script>
</body>
</html>
